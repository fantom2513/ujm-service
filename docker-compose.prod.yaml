networks:
  cx_net:
    external: true
    name: cx_copilot_cx_net

services:
  ux-architecture-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ux-architecture-backend:prod
    container_name: ux-architecture-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      # TEMPORARY: proxy-ai.sogaz.ru presents a cert signed by an internal CA
      # we don't have a copy of. Disables TLS chain verification process-wide
      # for this container. Remove once NODE_EXTRA_CA_CERTS can be set instead.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - cx_net

  ux-architecture-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ux-architecture-frontend:prod
    container_name: ux-architecture-frontend
    restart: unless-stopped
    networks:
      - cx_net
    depends_on:
      - ux-architecture-backend
