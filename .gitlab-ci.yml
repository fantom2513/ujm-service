stages:
  - security
  - test
  - build
  - deploy

.changes: &changes
  - Dockerfile
  - frontend/**/*
  - backend/**/*
  - backend-py/**/*
  - scripts/**/*
  - shared/**/*
  - docker-compose*.yaml
  - package.json
  - pnpm-lock.yaml
  - package-lock.json
  - .gitlab-ci.yml

test-py:
  stage: test
  needs:
    - job: test-node
      artifacts: true
  image: nexus.sogaz.ru/python:3.12-bookworm
  services:
    - name: nexus.sogaz.ru/library/postgres:15-alpine
      alias: postgres
  variables:
    PIP_INDEX_URL: https://nexus.sogaz.ru/repository/pypi-group/simple
    PIP_TRUSTED_HOST: nexus.sogaz.ru
    UV_INDEX_URL: https://nexus.sogaz.ru/repository/pypi-group/simple
    UV_SYSTEM_CERTS: "true"
    UV_INSECURE_HOST: nexus.sogaz.ru
    POSTGRES_DB: uxarch_test
    POSTGRES_USER: uxarch_test
    POSTGRES_PASSWORD: ci-test-only
    DATABASE_URL: postgresql+asyncpg://uxarch_test:ci-test-only@postgres:5432/uxarch_test
  tags:
    - ux02-copilot_docker
  script:
    - chmod +x "$CI_PROJECT_DIR/.ci-runtime/node"
    - export PATH="$CI_PROJECT_DIR/.ci-runtime:$PATH"
    - export MERMAID_MODULE_PATH="$CI_PROJECT_DIR/node_modules/mermaid/dist/mermaid.esm.min.mjs"
    - node --version
    - printf 'flowchart LR\nA["Start"] --> B["Finish"]\n' | node backend-py/app/domain/mermaid_parser.mjs | grep -q '"ok":true'
    - pip install --no-cache-dir uv
    - cd backend-py
    - uv sync
    - |
      for i in $(seq 1 30); do
        if uv run alembic current >postgres-readiness.log 2>&1; then
          echo "PostgreSQL ready"
          break
        fi
        if [ "$i" = "30" ]; then
          echo "PostgreSQL readiness check failed after 30 attempts; last Alembic error:"
          cat postgres-readiness.log
          exit 1
        fi
        sleep 1
      done
    - uv run pytest -q -ra
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "master"

test-node:
  stage: test
  image: nexus.sogaz.ru/node:24-bookworm-slim
  variables:
    NPM_CONFIG_REGISTRY: https://nexus.sogaz.ru/npm/
    NPM_CONFIG_STRICT_SSL: "false"
  tags:
    - ux02-copilot_docker
  script:
    - npm ci --no-audit --no-fund
    - npm test
    - npm run build
    - mkdir -p .ci-runtime
    - cp "$(command -v node)" .ci-runtime/node
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-runtime/
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "master"

.disk-preflight:
  script:
    - |
      MIN_FREE_GB="${MIN_FREE_GB:-15}"
      case "$MIN_FREE_GB" in
        ''|*[!0-9]*|0*) echo "disk-preflight: MIN_FREE_GB must be a positive integer, got '$MIN_FREE_GB'"; exit 1 ;;
      esac
      root="$(docker info --format '{{.DockerRootDir}}')"
      if [ -z "$root" ]; then echo "disk-preflight: cannot read DockerRootDir"; exit 1; fi
      if ! out="$(docker run --rm --entrypoint df -v "$root:/docker-data:ro" "${CI_JOB_IMAGE:-alpine}" -Pk /docker-data)"; then
        echo "disk-preflight: disk space measurement failed"; exit 1
      fi
      avail_kb="$(echo "$out" | awk 'NR==2 {print $4}')"
      case "$avail_kb" in
        ''|*[!0-9]*) echo "disk-preflight: unexpected df output: $out"; exit 1 ;;
      esac
      if ! awk -v a="$avail_kb" -v t="$((MIN_FREE_GB * 1024 * 1024))" 'BEGIN { exit !(a >= t) }'; then
        echo "disk-preflight: only $((avail_kb / 1024 / 1024)) GiB free under $root, need $MIN_FREE_GB GiB"; exit 1
      fi
      echo "disk-preflight: ok, $((avail_kb / 1024 / 1024)) GiB free under $root"

build-test:
  stage: build
  image: nexus.sogaz.ru/docker:25.0
  services:
    - docker:25.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  tags:
    - ux02-copilot_docker
  script:
    - echo "$ENV_TEST" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.test.yaml build
  after_script:
    - rm -f .env
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual

build-prod:
  stage: build
  image: nexus.sogaz.ru/docker:25.0
  services:
    - docker:25.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  tags:
    - ux01-copilot_docker
  script:
    - echo "$ENV_PROD" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.prod.yaml build
  after_script:
    - rm -f .env
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

deploy-test:
  stage: deploy
  resource_group: deploy-test
  image: nexus.sogaz.ru/docker:25.0-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  tags:
    - ux02-copilot_docker
  script:
    - !reference [.disk-preflight, script]
    - echo "$ENV_TEST" > .env
    - echo "ENV loaded"
    - |
      if [ "${SKIP_DB_BACKUP:-0}" = "1" ]; then
        echo "Skipping database backup: SKIP_DB_BACKUP=1 (first deployment only)"
      else
        mkdir -p /data/db_backup/ux-architecture-test
        file="/data/db_backup/ux-architecture-test/backup_ux-architecture-$(date +%Y%m%d_%H%M%S).sql"
        if ! docker exec ux-architecture-postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$file" || ! test -s "$file"; then
          rm -f "$file"
          echo "Database backup failed or empty: $file"
          exit 1
        fi
        echo "Database backup saved: $file ($(wc -c < "$file") bytes)"
      fi
    - docker compose -f docker-compose.test.yaml up -d --build --remove-orphans
    - echo "Waiting for ux-architecture-backend to be healthy..."
    - |
      for i in $(seq 1 30); do
        status=$(docker inspect --format='{{.State.Health.Status}}' ux-architecture-backend 2>/dev/null || echo "starting")
        if [ "$status" = "healthy" ]; then echo "backend healthy"; break; fi
        if [ "$i" = "30" ]; then echo "backend did not become healthy in time" && exit 1; fi
        sleep 3
      done
  after_script:
    - rm -f .env
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *changes
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual

deploy-prod:
  stage: deploy
  resource_group: deploy-prod
  image: nexus.sogaz.ru/docker:25.0-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  tags:
    - ux01-copilot_docker
  script:
    - !reference [.disk-preflight, script]
    - echo "$ENV_PROD" > .env
    - echo "ENV loaded"
    - |
      if [ "${SKIP_DB_BACKUP:-0}" = "1" ]; then
        echo "Skipping database backup: SKIP_DB_BACKUP=1 (first deployment only)"
      else
        mkdir -p /data/db_backup/ux-architecture-prod
        file="/data/db_backup/ux-architecture-prod/backup_ux-architecture-$(date +%Y%m%d_%H%M%S).sql"
        if ! docker exec ux-architecture-postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$file" || ! test -s "$file"; then
          rm -f "$file"
          echo "Database backup failed or empty: $file"
          exit 1
        fi
        echo "Database backup saved: $file ($(wc -c < "$file") bytes)"
      fi
    - docker compose -f docker-compose.prod.yaml up -d --build --remove-orphans
    - echo "Waiting for ux-architecture-backend to be healthy..."
    - |
      for i in $(seq 1 30); do
        status=$(docker inspect --format='{{.State.Health.Status}}' ux-architecture-backend 2>/dev/null || echo "starting")
        if [ "$status" = "healthy" ]; then echo "backend healthy"; break; fi
        if [ "$i" = "30" ]; then echo "backend did not become healthy in time" && exit 1; fi
        sleep 3
      done
  after_script:
    - rm -f .env
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *changes
      when: manual
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

include:
  - project: 'sast/sast'
    ref: master
    file: 'runSast.yml'
