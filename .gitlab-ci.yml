stages:
  - security
  - test
  - build
  - deploy

.changes: &changes
  - Dockerfile
  - frontend/**/*
  - backend/**/*
  - backend-py/**/*
  - scripts/**/*
  - shared/**/*
  - docker-compose*.yaml
  - package.json
  - pnpm-lock.yaml
  - .gitlab-ci.yml

test-py:
  stage: test
  image: nexus.sogaz.ru/python:3.12-bookworm
  services:
    - name: nexus.sogaz.ru/library/postgres:15-alpine
      alias: postgres
  variables:
    PIP_INDEX_URL: https://nexus.sogaz.ru/repository/pypi-group/simple
    PIP_TRUSTED_HOST: nexus.sogaz.ru
    UV_INDEX_URL: https://nexus.sogaz.ru/repository/pypi-group/simple
    UV_SYSTEM_CERTS: "true"
    UV_INSECURE_HOST: nexus.sogaz.ru
    POSTGRES_DB: uxarch_test
    POSTGRES_USER: uxarch_test
    POSTGRES_PASSWORD: ci-test-only
    DATABASE_URL: postgresql+asyncpg://uxarch_test:ci-test-only@postgres:5432/uxarch_test
  tags:
    - ux02-copilot_docker
  script:
    - pip install --no-cache-dir uv
    - cd backend-py
    - uv sync
    - |
      for i in $(seq 1 30); do
        if uv run alembic current >/dev/null 2>&1; then
          echo "PostgreSQL ready"
          break
        fi
        if [ "$i" = "30" ]; then
          echo "PostgreSQL did not become ready" && exit 1
        fi
        sleep 1
      done
    - uv run pytest -q -ra
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "master"

test-node:
  stage: test
  image: nexus.sogaz.ru/node:24-bookworm-slim
  variables:
    NPM_CONFIG_REGISTRY: https://nexus.sogaz.ru/npm/
    NPM_CONFIG_STRICT_SSL: "false"
  tags:
    - ux02-copilot_docker
  script:
    - npm install --no-audit --no-fund
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "master"

build-test:
  stage: build
  image: nexus.sogaz.ru/docker:25.0
  services:
    - docker:25.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  tags:
    - ux02-copilot_docker
  script:
    - echo "$ENV_TEST" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.test.yaml build
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual

build-prod:
  stage: build
  image: nexus.sogaz.ru/docker:25.0
  services:
    - docker:25.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  tags:
    - ux01-copilot_docker
  script:
    - echo "$ENV_PROD" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.prod.yaml build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *changes
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

deploy-test:
  stage: deploy
  image: nexus.sogaz.ru/docker:25.0-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  tags:
    - ux02-copilot_docker
  script:
    - echo "$ENV_TEST" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.test.yaml up -d --build --force-recreate
    - echo "Waiting for ux-architecture-backend to be healthy..."
    - |
      for i in $(seq 1 30); do
        status=$(docker inspect --format='{{.State.Health.Status}}' ux-architecture-backend 2>/dev/null || echo "starting")
        if [ "$status" = "healthy" ]; then echo "backend healthy"; break; fi
        if [ "$i" = "30" ]; then echo "backend did not become healthy in time" && exit 1; fi
        sleep 3
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *changes
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual

deploy-prod:
  stage: deploy
  image: nexus.sogaz.ru/docker:25.0-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  tags:
    - ux01-copilot_docker
  script:
    - echo "$ENV_PROD" > .env
    - echo "ENV loaded"
    - docker compose -f docker-compose.prod.yaml up -d --build --force-recreate
    - echo "Waiting for ux-architecture-backend to be healthy..."
    - |
      for i in $(seq 1 30); do
        status=$(docker inspect --format='{{.State.Health.Status}}' ux-architecture-backend 2>/dev/null || echo "starting")
        if [ "$status" = "healthy" ]; then echo "backend healthy"; break; fi
        if [ "$i" = "30" ]; then echo "backend did not become healthy in time" && exit 1; fi
        sleep 3
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *changes
      when: manual
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

include:
  - project: 'sast/sast'
    ref: master
    file: 'runSast.yml'
