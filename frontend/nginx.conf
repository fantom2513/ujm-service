server {
    listen 80;
    server_name _;

    location = /ux-architecture/api/chat {
        # Chat attachments are capped at 20 MiB by the application
        # (app.config.max_chat_attachment_bytes). 21m, not 20m: this limit
        # covers the whole multipart body -- mermaidCode, message, actionType,
        # requestId, sessionId and the MIME boundaries ride along with the
        # file, and both the frontend and Python use a strict ">", so a file of
        # exactly 20 MiB is legal and 20m here would reject it at the proxy.
        # The general 110m limit below stays for 100 MB recordings on
        # /api/generate.
        client_max_body_size 21m;
        proxy_pass http://ux-architecture-backend:8001/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ux-architecture/api/ {
        # Diagram generation waits for an LLM response and can legitimately
        # take longer than nginx's default 60-second proxy timeout.
        client_max_body_size 110m;
        proxy_pass http://ux-architecture-backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /ux-architecture {
        return 301 /ux-architecture/;
    }

    # The corporate nginx image does not map .mjs to a JavaScript MIME type.
    # Browsers reject ES modules served as application/octet-stream, so serve
    # the bundled Mermaid runtime from a dedicated location with the required
    # type.
    location ^~ /ux-architecture/vendor/mermaid/ {
        alias /usr/share/nginx/html/vendor/mermaid/;
        default_type application/javascript;
    }

    location /ux-architecture/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ux-architecture/index.html;
    }
}
