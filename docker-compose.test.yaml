networks:
  cx_net:
    external: true
    name: cx_copilot_cx_net

volumes:
  ux-architecture-postgres-test-data:

services:
  ux-architecture-postgres:
    image: nexus.sogaz.ru/library/postgres:15-alpine
    container_name: ux-architecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uxarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-uxarch}
    volumes:
      - ux-architecture-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uxarch} -d ${POSTGRES_DB:-uxarch}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cx_net

  ux-architecture-backend:
    build:
      context: .
      dockerfile: backend-py/Dockerfile
    image: ux-architecture-backend-py:test
    container_name: ux-architecture-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      IDENTITY_MODE: anonymous
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      ux-architecture-postgres:
        condition: service_healthy
    networks:
      - cx_net

  ux-architecture-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ux-architecture-frontend:test
    container_name: ux-architecture-frontend
    restart: unless-stopped
    networks:
      - cx_net
    depends_on:
      ux-architecture-backend:
        condition: service_healthy
